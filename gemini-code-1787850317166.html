<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess vs. Evil Mina (700 Elo)</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 5px;
            color: #ff4d4d;
        }
        p {
            color: #b0b0b0;
            margin-top: 0;
            margin-bottom: 20px;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        #board {
            width: 400px;
        }
        #status {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .controls {
            margin-top: 15px;
        }
        button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e03b3b;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Evil Mina</h1>
        <p>Rating: 700 &bull; Play Carefully!</p>
        
        <div id="board"></div>
        
        <div id="status">Your turn (White)</div>
        
        <div class="controls">
            <button id="restart-btn">New Game</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        let board = null;
        let game = new Chess();
        const statusEl = $('#status');

        // Function to make Evil Mina's move
        function makeMinaMove() {
            if (game.game_over()) return;

            statusEl.text("Evil Mina is thinking...");

            setTimeout(() => {
                const possibleMoves = game.ugly_moves({ verbose: true });
                
                if (possibleMoves.length === 0) return;

                // Simulate a 700-rated bot: mostly random moves with occasional captures/checks
                let selectedMove;
                
                // 700 Elo logic: Look for capturing moves first 40% of the time, otherwise pick randomly
                const captureMoves = possibleMoves.filter(m => m.captured);
                if (captureMoves.length > 0 && Math.random() < 0.4) {
                    selectedMove = captureMoves[Math.floor(Math.random() * captureMoves.length)];
                } else {
                    selectedMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                }

                game.move(selectedMove);
                board.position(game.fen());
                updateStatus();
            }, 600); // Artificial delay to feel like a real opponent
        }

        // Handle piece drops by the user
        function onDrop(source, target) {
            // See if the move is legal
            const move = game.move({
                from: source,
                to: target,
                promotion: 'q' // NOTE: always promote to a queen for simplicity
            });

            // If illegal, return snapshot
            if (move === null) return 'snapback';

            updateStatus();

            // If game is not over, trigger Evil Mina's turn
            if (!game.game_over()) {
                window.setTimeout(makeMinaMove, 250);
            }
        }

        // Update game state and status messages
        function updateStatus() {
            let status = '';

            let moveColor = 'White';
            if (game.turn() === 'b') {
                moveColor = 'Evil Mina (Black)';
            }

            if (game.in_checkmate()) {
                status = `Game over, ${moveColor} is in checkmate.`;
            } else if (game.in_draw()) {
                status = 'Game over, drawn position.';
            } else {
                status = `${moveColor}'s turn`;
                if (game.in_check()) {
                    status += `, ${moveColor} is in check!`;
                }
            }

            statusEl.text(status);
        }

        // Board configuration options
        const config = {
            draggable: true,
            position: 'start',
            onDragStart: function (source, piece, position, orientation) {
                // Do not pick up pieces if the game is over or if it's Mina's turn
                if (game.game_over() || game.turn() === 'b') return false;
                // Only allow moving White pieces
                if (piece.search(/^b/) !== -1) return false;
            },
            onDrop: onDrop,
            onSnapEnd: function () {
                board.position(game.fen());
            }
        };

        // Initialize the board
        board = Chessboard('board', config);
        updateStatus();

        // Restart button listener
        $('#restart-btn').on('click', function () {
            game.reset();
            board.start();
            updateStatus();
        });
    </script>
</body>
</html>
