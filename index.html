<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Arcade Hub</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #ffcc00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        p {
            color: #b0b0b0;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 25px;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #ffcc00;
        }
        .card h2 {
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            background-color: #ffcc00;
            color: #121212;
            text-decoration: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #ffdb4d;
        }
    </style>
</head>
<body>

    <h1>🎮 My Arcade Hub</h1>
    <p>Select a game below to start playing right away!</p>

    <div class="grid">
        <div class="card">
            <h2>Mario Boss Fight</h2>
            <a href="mario.html" class="btn">Play Game</a>
        </div>
        <div class="card">
            <h2>Flappy Bird</h2>
            <a href="flappy.html" class="btn">Play Game</a>
        </div>
        <div class="card">
            <h2>FIFA World Cup 2026</h2>
            <a href="worldcup.html" class="btn">Play Game</a>
        </div>
        <div class="card">
            <h2>Multi-Scrolling Platformer</h2>
            <a href="platformer.html" class="btn">Play Game</a>
        </div>
        <div class="card">
            <h2>Soccer Game</h2>
            <a href="soccer.html" class="btn">Play Game</a>
        </div>
    </div>

</body>
</html>
